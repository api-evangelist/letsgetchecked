- aid: letsgetchecked:api-notifications
  name: LetsGetChecked API Notifications (Webhooks)
  description: 'Event-driven webhook notifications delivered by POST to client-supplied
    endpoints whenever an order, result or outreach resource changes. Payloads carry
    a resource identifier, a callback URL back into the REST APIs, a type discriminator
    and a UTC timestamp. Delivery is at-least-once and unordered, with a documented
    retry ladder, and payloads can be signed with an LGC2-HMAC-SHA256 Authorization
    header using a client-supplied base64 signing key.'
  humanURL: https://docs.letsgetchecked.com/documentation/API%20Reference/API%20Notifications/webhooks/
