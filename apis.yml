apis:
- aid: letsgetchecked:orders-api-v1
  name: LetsGetChecked Orders API (Version 1)
  description: 'Version 1 of the LetsGetChecked Orders API. Create a pre-activated
    test-kit order against a client-supplied order identifier (PUT is documented as
    idempotent), query order status from dispatch through delivery, registration,
    arrival at the lab and results availability, retrieve the pre-registration questionnaire
    for a test kit, and read replacement-kit linkage when a sample is unusable or a
    kit is lost or damaged in transit.'
  humanURL: https://docs.letsgetchecked.com/documentation/API%20Reference/Orders%20API/orders/
