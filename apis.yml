aid: letsgetchecked
name: LetsGetChecked
description: 'LetsGetChecked (operating as LetsGetChecked powered by FuzeHealth) is
  an Irish-American virtual care company that runs an end-to-end diagnostics and care
  platform: it manufactures at-home sample-collection kits, operates its own CLIA-accredited
  laboratories in the United States and Europe, and layers telehealth consultations,
  clinical review and affiliate-pharmacy prescription delivery on top of the results.
  Its Halo platform is a purpose-built EMR that exposes B2B REST APIs — the Orders
  API (v1 and v2), the Results API and the Outreach API — plus event-driven webhook
  notifications, so employers, health plans, providers, public-sector programs and
  life-sciences partners can order pre-activated test kits, track kit fulfillment,
  and retrieve laboratory results in JSON, HL7 or PDF form inside their own systems.'
