- aid: letsgetchecked:results-api
  name: LetsGetChecked Results API
  description: 'Read laboratory results for test kits processed by the LetsGetChecked
    lab. Retrieve a full result set for a barcode (with optional alpha code), fetch
    just the result status, or pull the raw lab result. Results carry per-biomarker
    detail — biomarker name, quantitative or qualitative or genetic kind, descriptor
    bands, reference bounds, headline narrative, and LOINC coding — and are available
    in JSON, HL7 or PDF representations.'
  humanURL: https://docs.letsgetchecked.com/documentation/API%20Reference/Results%20API/results/
  tags:
  - Results
  - Laboratory
  - Biomarkers
  - HL7
  - LOINC
  - Healthcare
  properties:
  - type: Documentation
    url: https://docs.letsgetchecked.com/documentation/API%20Reference/Results%20API/results/
  - type: APIReference
    url: https://docs.letsgetchecked.com/documentation/API%20Reference/Results%20API/results_req/
- aid: letsgetchecked:outreach-api
  name: LetsGetChecked Outreach API
  description: 'Retrieve and download the results letters LetsGetChecked generates
    for patients and for a patient''s Primary Care Provider. List outreach notifications
    for a client program with date filtering and X-Continuation-Token cursor paging,
    fetch a single notification by test-kit barcode, walk a results-letters event feed
    from a start event, and download the generated letter document by letter identifier.'
  humanURL: https://docs.letsgetchecked.com/documentation/API%20Reference/Outreach%20API/outreach/
  tags:
  - Outreach
  - Notification
  - Documents
  - Patient Communications
  - Healthcare
  tags_raw:
