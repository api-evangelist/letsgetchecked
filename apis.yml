- aid: letsgetchecked:orders-api-v2
  name: LetsGetChecked Orders API (Version 2)
  description: 'Version 2 of the LetsGetChecked Orders API, documented September 2023.
    Adds an order-item model with per-item identifiers and statuses, a PATCH endpoint
    for cancelling an order item up to the KitArrivedAtLab status (processed asynchronously
    and confirmed by webhook), a consolidated GET Order response replacing GET Order
    Status, and replacementOrderItemId linkage for replacement kits.'
  humanURL: https://docs.letsgetchecked.com/documentation/API%20Reference/Orders%20API/orders/
