name: LetsGetChecked Developer Glossary
description: 'The glossary LetsGetChecked publishes alongside its B2B API reference. It is a mixed
  technical and clinical vocabulary: API and authentication terms a developer needs to read the reference,
  healthcare interchange standards (HL7, the OBX segment, NPI), regulatory definitions (CLIA, PHI
  under HIPAA), and the clinical concepts (biomarkers, genotype, phenotype, specific analytes) that
  appear in result payloads. Published 3 March 2022. Captured verbatim.'
